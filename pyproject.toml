[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vimeo-playlist-downloader"
dynamic = ["version"]
description = "Unofficial CLI for downloading Vimeo JSON/DASH playlists"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rnwst" }]
keywords = ["dash", "downloader", "video", "vimeo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
vimeo-playlist-downloader = "download_vimeo:main"

[project.urls]
Homepage = "https://github.com/rnwst/vimeo-downloader"
Issues = "https://github.com/rnwst/vimeo-downloader/issues"
Repository = "https://github.com/rnwst/vimeo-downloader.git"

[tool.setuptools]
py-modules = ["download_vimeo"]

[tool.setuptools.dynamic]
version = { attr = "download_vimeo.__version__" }

[tool.black]
target-version = ["py310"]

[tool.pylint.main]
py-version = "3.10"

[tool.pyright]
include = ["download_vimeo.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
