name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Black
            command: black --check --diff download_vimeo.py
          - name: Pylint
            command: pylint download_vimeo.py
          - name: Pyright
            command: pyright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              wheel_members = archive.namelist()

          sdist = next(Path("dist").glob("*.tar.gz"))
          with open_tar(sdist) as archive:
              sdist_members = archive.getnames()

          if "download_vimeo.py" not in wheel_members:
              raise SystemExit("wheel does not contain download_vimeo.py")
          if not any(name.endswith("/download_vimeo.py") for name in sdist_members):
              raise SystemExit("sdist does not contain download_vimeo.py")

          for artifact, members in (
              (wheel.name, wheel_members),
              (sdist.name, sdist_members),
          ):
              forbidden = [
                  member
                  for member in members
                  if Path(member).name == "playlist.json"
                  or Path(member).suffix.lower()
                  in {".m4v", ".mkv", ".mov", ".mp4"}
              ]
              if forbidden:
                  raise SystemExit(f"{artifact} contains local media: {forbidden}")
          PY

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Smoke-test installed command
        working-directory: ${{ runner.temp }}
        run: |
          vimeo-playlist-downloader --version
          vimeo-playlist-downloader --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
