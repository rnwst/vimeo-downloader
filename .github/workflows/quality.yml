name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Black
            command: black --check --diff download_vimeo.py
          - name: Pylint
            command: pylint download_vimeo.py
          - name: Pyright
            command: pyright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
